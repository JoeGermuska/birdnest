{% from "_macros.html" import icon %}
<nav id="topbar">
    <h1><a href="/">Conference of the Birds</a></h1>
    <div class="nav-links"><a href="{{ url_for('browse') }}">Shows</a><a href="{{ url_for('ranking', kind='artists') }}">Rankings</a><a href="{{ url_for('genre_map') }}">Genre map</a><a href="{{ url_for('djs') }}">DJs</a><a href="{{ url_for('radio_page') }}">Radio</a></div>
    <form id="search" role="search" action="{{ url_for('search')}}" method="GET">
        <div class="autocomplete-container">
            <button type="button" class="search-toggle" aria-label="Search" title="Search (press / to jump here)">{{ icon('search') }}</button>
            {{ icon('search', 'search-icon') }}
            <input type="search" id="q" name="q" autocomplete="off" value="{{ terms or '' }}" placeholder="artist, track, album, genre" aria-label="Search artists, tracks, albums, genres" title="Search artists, tracks, albums, genres (press / to jump here)">
            <div id="autocomplete-dropdown" class="autocomplete-dropdown"></div>
        </div>
    </form>
    <div class="banner-tools">
    <details class="nerd-menu">
        <summary title="Help link the data: to-do lists for Wikidata and MusicBrainz" aria-label="To-do lists for linking data">🤓</summary>
        <div class="nerd-list">
            <p>Help link the data</p>
            <a href="{{ url_for('wikidata_todo') }}">Artists on Wikidata</a>
            <a href="{{ url_for('wikidata_album_todo') }}">Albums on Wikidata</a>
            <a href="{{ url_for('musicbrainz_album_todo') }}">Albums on MusicBrainz</a>
        </div>
    </details>
    <button type="button" id="theme-toggle" title="Light or dark" aria-label="Switch between light and dark">{{ icon('moon', 'theme-moon') }}{{ icon('sun', 'theme-sun') }}</button>
    </div>
</nav>
<script>
(function () {
    // the 🤓 menu closes on a click elsewhere or Escape (bound once; the banner is replaced on each page view)
    if (!window.birdsNerdBound) {
        window.birdsNerdBound = true;
        const close = e => document.querySelectorAll('.nerd-menu[open]').forEach(d => {
            if (e.type === 'keydown' ? e.key === 'Escape' : !d.contains(e.target)) d.open = false;
        });
        document.addEventListener('click', close);
        document.addEventListener('keydown', close);
    }
    // Search: on phones it's just the magnifying glass until opened (click, or / from _base.html). Opening it,
    // or focusing it any way, selects what's there, so typing replaces it.
    const topbar = document.getElementById('topbar'), q = document.getElementById('q');
    window.birdsOpenSearch = () => {
        const bar = document.getElementById('topbar'), box = document.getElementById('q');
        bar.classList.add('search-open');
        box.focus();
        box.select();
    };
    topbar.querySelector('.search-toggle').addEventListener('click', window.birdsOpenSearch);
    q.addEventListener('focus', () => setTimeout(() => q.select()));  // after the click places the caret
    q.addEventListener('focusout', () => setTimeout(() => {  // later, so a click on a suggestion still lands
        if (!topbar.querySelector('form#search').contains(document.activeElement)) topbar.classList.remove('search-open');
    }, 250));
    q.addEventListener('keydown', e => { if (e.key === 'Escape') q.blur(); });

    // open toward whichever side has room (the banner wraps on phones, putting the 🤓 at the left)
    const nerd = document.querySelector('.nerd-menu');
    if (nerd) nerd.addEventListener('toggle', () => {
        const list = nerd.querySelector('.nerd-list');
        list.style.left = list.style.right = '';
        if (nerd.open && list.getBoundingClientRect().left < 8) { list.style.left = '0'; list.style.right = 'auto'; }
    });

    // Autocomplete functionality
    let autocompleteTimer = null;
    let selectedIndex = -1;

    function initAutocomplete() {
        const searchInput = document.getElementById('q');
        const dropdown = document.getElementById('autocomplete-dropdown');

        if (!searchInput || !dropdown) return;

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();

            if (autocompleteTimer) {
                clearTimeout(autocompleteTimer);
            }

            if (query.length < 2) {
                hideDropdown();
                return;
            }

            autocompleteTimer = setTimeout(() => {
                fetchSuggestions(query);
            }, 300);
        });

        searchInput.addEventListener('keydown', function(e) {
            const items = dropdown.querySelectorAll('.autocomplete-item');

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                updateSelection(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, -1);
                updateSelection(items);
            } else if (e.key === 'Enter' && selectedIndex >= 0) {
                e.preventDefault();
                items[selectedIndex].click();
            } else if (e.key === 'Escape') {
                hideDropdown();
            }
        });

        if (!window.autocompleteClickBound) {  // once: this script runs again on every Turbo page view
            window.autocompleteClickBound = true;
            document.addEventListener('click', function(e) {
                const input = document.getElementById('q'), box = document.getElementById('autocomplete-dropdown');
                if (input && box && !input.contains(e.target) && !box.contains(e.target)) hideDropdown();
            });
        }
    }

    async function fetchSuggestions(query) {
        try {
            const response = await fetch(`/autocomplete?q=${encodeURIComponent(query)}`);
            const suggestions = await response.json();
            showSuggestions(suggestions);
        } catch (error) {
            console.error('Autocomplete error:', error);
            hideDropdown();
        }
    }

    function showSuggestions(suggestions) {
        const dropdown = document.getElementById('autocomplete-dropdown');
        const searchInput = document.getElementById('q');

        if (suggestions.length === 0) {
            hideDropdown();
            return;
        }

        dropdown.innerHTML = suggestions
            .map((suggestion, index) =>
                `<div class="autocomplete-item" data-index="${index}">${escapeHtml(suggestion)}</div>`)
            .join('');

        dropdown.style.display = 'block';
        selectedIndex = -1;

        dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
            item.addEventListener('click', function() {
                searchInput.value = this.textContent;
                hideDropdown();
                searchInput.form.submit();
            });
        });
    }

    function hideDropdown() {
        const dropdown = document.getElementById('autocomplete-dropdown');
        dropdown.style.display = 'none';
        selectedIndex = -1;
    }

    function updateSelection(items) {
        items.forEach((item, index) => {
            item.classList.toggle('selected', index === selectedIndex);
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // this script sits at the end of the page, so the elements are there; it runs again on each Turbo page view
    initAutocomplete();

    window.hideDropdown = hideDropdown;
})();
</script>
